<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>GPS Personnel V50</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07152a;color:#f1faff;font-family:Arial,sans-serif}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.hud{position:absolute;z-index:3;top:10px;left:10px;right:10px;display:flex;gap:8px;pointer-events:none}.panel{background:rgba(2,13,27,.88);border:1px solid #3c91a4;border-radius:14px;padding:9px 12px;box-shadow:0 6px 20px #0005}.speed{text-align:center;min-width:72px}.n{font-size:28px;font-weight:800}.small{font-size:11px;color:#c1d3df}.limit{width:35px;height:35px;margin:5px auto 0;border:4px solid #e74658;border-radius:50%;background:white;color:#111;display:grid;place-items:center;font-weight:800}.info{flex:1;min-width:0}.tag{font-size:10px;letter-spacing:1.3px;font-weight:800;color:#64e9f4}.title{font-size:15px;font-weight:800;margin-top:5px}.sub{font-size:11px;color:#c4d4df;margin-top:4px}.bottom{position:absolute;z-index:3;left:10px;right:10px;bottom:12px;display:flex;gap:7px;align-items:flex-end}.status{flex:1;font-size:11px;line-height:1.35;min-width:0}.btn{pointer-events:auto;border:1px solid #31798a;border-radius:12px;background:rgba(3,21,38,.95);color:#effbff;font-size:11px;font-weight:800;padding:12px 9px;min-height:43px}@media(min-width:700px){.hud{top:20px;left:20px;right:20px}.panel{padding:14px 17px}.n{font-size:38px}.tag{font-size:13px}.title{font-size:22px}.sub{font-size:15px}.bottom{left:20px;right:20px;bottom:20px}.btn{font-size:14px;padding:15px}}</style></head><body><canvas id="view"></canvas><div class="hud"><div class="panel speed"><div class="n" id="speed">0</div><div class="small">km/h GPS</div><div class="limit">50</div></div><div class="panel info"><div class="tag">GPS PERSONNEL · V50</div><div class="title">VUE CONDUITE 3D</div><div class="sub">Route courbe · décor volumétrique · flèches cyan</div></div></div><div class="bottom"><div class="panel status"><b style="color:#63e9f4">● ESSAI VISUEL</b><br>Scène stylisée animée — itinéraire réel non connecté</div><button class="btn" id="gps">ACTIVER GPS</button><button class="btn" id="pause">PAUSE</button></div><script>
const canvas=document.getElementById('view'),ctx=canvas.getContext('2d');let W=0,H=0,dpr=1,paused=false,phase=0,watch=null;function resize(){dpr=Math.min(devicePixelRatio||1,1.6);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function poly(pts,fill,stroke=null,lw=1){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}function line(x1,y1,x2,y2,color,width=1){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}function glow(x,y,r,color){let g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color);g.addColorStop(1,'rgba(255,190,100,0)');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2)}function road(t){let hz=H*.43,y=hz+Math.pow(t,1.55)*(H-hz)*1.12,c=(Math.sin(t*4.1+phase*.6)*.12+Math.sin(t*8-phase)*.025)*W,x=W*.5+c*t,half=W*(.012+Math.pow(t,1.24)*.47);return{x,y,l:x-half,r:x+half,half}}function draw(){if(!paused)phase+=.012;ctx.clearRect(0,0,W,H);let sky=ctx.createLinearGradient(0,0,0,H*.53);sky.addColorStop(0,'#06142a');sky.addColorStop(.48,'#123251');sky.addColorStop(1,'#526c7a');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H*.53);let hz=H*.43,haze=ctx.createRadialGradient(W*.5,hz,2,W*.5,hz,W*.7);haze.addColorStop(0,'rgba(116,169,193,.25)');haze.addColorStop(1,'rgba(6,20,40,0)');ctx.fillStyle=haze;ctx.fillRect(0,hz-H*.2,W,H*.42);for(let s of [-1,1])for(let i=0;i<12;i++){let t=i/11,x=W*.5+s*W*(.17+t*.32),base=hz+H*(.015+t*.025),bw=W*(.025+t*.025),bh=H*(.06+t*.11);poly([[x-bw/2,base-bh],[x+bw/2,base-bh*.96],[x+bw/2,base],[x-bw/2,base]],['#1b2e44','#23374e','#2c3b50'][i%3])}ctx.fillStyle='#17332f';ctx.fillRect(0,hz,W,H-hz);let L=[],R=[],SL=[],SR=[];for(let i=0;i<=90;i++){let e=road(i/90);L.push([e.l,e.y]);R.push([e.r,e.y]);SL.push([e.l-W*(.008+i/90*.028),e.y]);SR.push([e.r+W*(.008+i/90*.028),e.y])}poly([...SL,...SR.slice().reverse()],'#66747a');poly([...L,...R.slice().reverse()],'#293746');line(SL[0][0],SL[0][1],SL[90][0],SL[90][1],'#d6e1e4',1.5);line(SR[0][0],SR[0][1],SR[90][0],SR[90][1],'#d6e1e4',1.5);for(let i=0;i<22;i++){let t=((i/22+phase*.026)%1);if(t<.015)continue;let e=road(t),ww=1+t*5,hh=2+t*26;poly([[e.x-ww/2,e.y-hh/2],[e.x+ww/2,e.y-hh/2],[e.x+ww/2,e.y+hh/2],[e.x-ww/2,e.y+hh/2]],'#d8e5e9')}let objs=[];for(let s of [-1,1])for(let i=0;i<20;i++){let t=.025+((i/20+phase*.014)%1)*.95;objs.push({s,i,t,k:i%3})}objs.sort((a,b)=>a.t-b.t);for(let o of objs){let{s,i,t,k}=o,e=road(t),x=e.x+s*(e.half+W*(.018+t*.085)),y=e.y;if(k===0){let bw=W*(.008+t*.033)*(1+(i%3)*.14),bh=H*(.035+t*.19)*(1+(i%4)*.1),dep=bw*.24;poly([[x-bw/2,y-bh],[x+bw/2,y-bh*.97],[x+bw/2,y],[x-bw/2,y]],['#2b3b51','#35445a','#25364c','#3b4859'][i%4]);poly([[x+bw/2,y-bh*.97],[x+bw/2+dep,y-bh*.91],[x+bw/2+dep,y],[x+bw/2,y]],'#18283b')}else if(k===1){let rw=W*(.004+t*.018),th=H*(.035+t*.11);poly([[x-rw*.15,y-th*.25],[x+rw*.15,y-th*.25],[x+rw*.15,y],[x-rw*.15,y]],'#4a443c');poly([[x,y-th*1.2],[x-rw*1.15,y-th*.2],[x+rw*1.15,y-th*.2]],'#064b3d');poly([[x,y-th*.88],[x-rw*.9,y],[x+rw*.9,y]],'#08705a')}else{let ph=H*(.03+t*.09),lx=x-s*W*(.004+t*.006);line(x,y,lx,y-ph,'#8193a0',Math.max(1,t*2));line(lx,y-ph,lx-s*W*(.006+t*.006),y-ph,'#8193a0',Math.max(1,t*2));glow(lx-s*W*(.006+t*.006),y-ph,3+t*17,'rgba(255,197,103,.17)');ctx.fillStyle='#ffe0a1';ctx.beginPath();ctx.arc(lx-s*W*(.006+t*.006),y-ph,Math.max(1,t*2.6),0,Math.PI*2);ctx.fill()}}for(let i=0;i<15;i++){let t=.018+((i/15+phase*.032)%1)*.89,e=road(t),sz=W*(.004+t*.031);ctx.save();ctx.translate(e.x,e.y);ctx.shadowColor='#00efff';ctx.shadowBlur=5+t*20;poly([[0,-sz*1.55],[-sz,sz*.2],[-sz*.34,sz*.02],[-sz*.34,sz*.82],[sz*.34,sz*.82],[sz*.34,sz*.02],[sz,sz*.2]],`rgba(0,231,255,${.45+t*.5})`);ctx.restore()}let vig=ctx.createRadialGradient(W*.5,H*.52,H*.15,W*.5,H*.52,H*.8);vig.addColorStop(.55,'rgba(0,0,0,0)');vig.addColorStop(1,'rgba(0,5,14,.36)');ctx.fillStyle=vig;ctx.fillRect(0,0,W,H);requestAnimationFrame(draw)}requestAnimationFrame(draw);document.getElementById('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'REPRENDRE':'PAUSE'};document.getElementById('gps').onclick=e=>{if(!navigator.geolocation){e.target.textContent='GPS INDISPONIBLE';return}e.target.textContent='GPS…';navigator.geolocation.getCurrentPosition(p=>{document.getElementById('speed').textContent=Math.round((p.coords.speed||0)*3.6);e.target.textContent='GPS ACTIF';if(watch!==null)navigator.geolocation.clearWatch(watch);watch=navigator.geolocation.watchPosition(q=>document.getElementById('speed').textContent=Math.round((q.coords.speed||0)*3.6),()=>{}, {enableHighAccuracy:true,maximumAge:1000,timeout:10000})},()=>{e.target.textContent='GPS REFUSÉ'}, {enableHighAccuracy:true,timeout:10000})};
</script></body></html>
