<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#071426">
<title>GPS Personnel V45 — Scène 3D stylisée</title>
<style>
:root{color-scheme:dark;--cyan:#20efff;--panel:#06111ee8;--line:#3bdff755}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071426;color:#effaff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.hud{position:absolute;inset:calc(env(safe-area-inset-top,0px) + 12px) 12px auto;display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:start;pointer-events:none}.panel{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:10px 13px;box-shadow:0 8px 28px #0005;backdrop-filter:blur(10px)}.speedbox{min-width:95px;text-align:center}.speed{font-size:clamp(25px,6vw,36px);font-weight:900;line-height:1}.unit{font-size:11px;color:#b8cbd8}.limit{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border:4px solid #f04454;border-radius:50%;background:#f8fbff;color:#111827;font-weight:900;font-size:14px;margin-top:7px}.turnbox{min-width:0}.eyebrow{font-size:10px;font-weight:900;letter-spacing:.13em;color:#6deeff}.turnline{display:flex;align-items:center;gap:9px;margin-top:4px}.turnicon{font-size:29px;color:var(--cyan);line-height:1}.distance{font-size:21px;font-weight:900}.street{font-size:12px;color:#d3e4ee;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.routebox{min-width:78px;text-align:right}.routebox strong{display:block;font-size:19px}.routebox span{font-size:11px;color:#c0d2df}.bottom{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;justify-content:space-between;align-items:end;gap:8px;pointer-events:none}.status{max-width:70%;font-size:11px;color:#d0e3ed;background:#06111edb;border:1px solid #3bdff744;border-radius:12px;padding:9px 11px}.controls{display:flex;gap:7px;pointer-events:auto}.btn{border:1px solid #52dff977;border-radius:13px;background:#071a2beF;color:#e8fbff;padding:10px 12px;font-size:11px;font-weight:800;box-shadow:0 5px 20px #0004}.btn:active{transform:scale(.97)}.btn.primary{background:#063442}.tag{color:#63eaff}.notice{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:12px 16px;background:#06111edb;border:1px solid var(--line);border-radius:14px;font-size:12px;text-align:center;max-width:80%;pointer-events:none;transition:opacity .4s}.notice.hidden{opacity:0}.footer{position:absolute;left:0;right:0;bottom:0;height:24px;background:linear-gradient(transparent,#06111e55);pointer-events:none}@media(max-width:380px){.hud{grid-template-columns:auto 1fr;}.routebox{display:none}.panel{padding:9px 10px}.bottom{align-items:stretch;flex-direction:column}.status{max-width:100%}.controls{justify-content:flex-end}}
</style></head><body>
<canvas id="scene" aria-label="Scène de navigation 3D stylisée"></canvas>
<div class="hud"><div class="panel speedbox"><div class="speed" id="speed">0</div><div class="unit">km/h GPS</div><div class="limit" id="limit">50</div></div><div class="panel turnbox"><div class="eyebrow" id="state">V45 · SCÈNE 3D</div><div class="turnline"><div class="turnicon" id="turn">↱</div><div style="min-width:0"><div class="distance" id="distance">ESSAI VISUEL</div><div class="street" id="street">Route stylisée · sans habitacle</div></div></div></div><div class="panel routebox"><strong id="heading">NORD</strong><span id="gps">GPS en attente</span></div></div>
<div class="notice" id="notice">Scène 3D stylisée · le décor défile pour l'essai visuel</div>
<div class="bottom"><div class="status" id="status"><span class="tag">●</span> Mode démonstration · flèches cyan sur la chaussée</div><div class="controls"><button class="btn" id="gpsBtn">ACTIVER GPS</button><button class="btn primary" id="motionBtn">PAUSE DÉFILEMENT</button></div></div><div class="footer"></div>
<script>
(()=>{'use strict';const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d');let W=0,H=0,dpr=1,t=0,last=0,paused=false,gpsWatch=null,realSpeed=0,heading=null,hasFix=false,permission=false;const $=id=>document.getElementById(id);function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const lerp=(a,b,p)=>a+(b-a)*p;function poly(points,fill,stroke=null,lw=1){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}function line(points,color,lw=1){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.stroke()}function roadX(p){const horizon=H*.405,base=H*1.04,y=lerp(horizon,base,p),curve=Math.sin(t*.24+p*2.6)*W*.075*p*p;return {y,cx:W*.5+curve,half:lerp(W*.025,W*.47,p),p}}function drawSky(){let g=ctx.createLinearGradient(0,0,0,H*.55);g.addColorStop(0,'#061126');g.addColorStop(.55,'#12345a');g.addColorStop(1,'#49617b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);for(let i=0;i<32;i++){let x=(i*97%W),y=(i*47%Math.max(1,H*.32));ctx.fillStyle=`rgba(160,220,255,${.12+(i%4)*.05})`;ctx.fillRect(x,y,1.2,1.2)}let glow=ctx.createRadialGradient(W*.52,H*.39,1,W*.52,H*.39,W*.42);glow.addColorStop(0,'#b6d5ff18');glow.addColorStop(1,'#1a376900');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H*.6)}function drawTerrain(){const h=H*.405;ctx.fillStyle='#102b35';ctx.fillRect(0,h,W,H-h);poly([[0,h],[W*.5,h-4],[W,h],[W,H],[0,H]],'#132d35');for(let side of [-1,1]){for(let i=0;i<13;i++){let p=((i/13+(t*.018)%1)%1);let xroad=roadX(p),x=xroad.cx+side*(xroad.half+lerp(8,W*.25,p));let y=xroad.y;let scale=.15+p*1.15;ctx.fillStyle=i%3===0?'#1d4650':'#183c47';ctx.fillRect(x-8*scale,y-38*scale,16*scale,38*scale)}}}
function drawBuildings(){for(let side of [-1,1]){for(let i=0;i<15;i++){let p=((i/15+(side===1?.06:0)+(t*.012)%1)%1);if(p<.06)continue;const r=roadX(p),scale=.15+p*1.35,offset=r.half+lerp(30,W*.28,p),x=r.cx+side*offset;let bw=(17+(i*13%22))*scale,bh=(45+(i*29%80))*scale;let top=r.y-bh;const front=i%3===0?'#283b50':i%3===1?'#1c3045':'#24344a',edge='#3d5065';if(side<0){poly([[x,top],[x+bw*.18,top-5*scale],[x+bw*.18,r.y],[x,r.y]],'#101f31');poly([[x,top],[x+bw,top],[x+bw,r.y],[x,r.y]],front,edge,.5)}else{poly([[x,top],[x+bw*.18,top-5*scale],[x+bw*.18,r.y],[x,r.y]],'#34465b');poly([[x,top],[x+bw,top],[x+bw,r.y],[x,r.y]],front,edge,.5)}}}}
function drawTrees(){for(let side of [-1,1])for(let i=0;i<17;i++){let p=((i/17+(side===1?.04:0)+(t*.022)%1)%1);if(p<.04)continue;let r=roadX(p),scale=.12+p*1.2,x=r.cx+side*(r.half+lerp(18,W*.15,p)),y=r.y;const trunk=3*scale,th=(15+p*18)*scale,rad=(7+p*10)*scale;ctx.fillStyle='#263b3e';ctx.fillRect(x-trunk/2,y-th*.45,trunk,th*.45);poly([[x,y-th*1.65],[x-rad,y-th*.35],[x+rad,y-th*.35]],i%2?'#17453f':'#1a5146');poly([[x,y-th*1.22],[x-rad*.8,y-th*.05],[x+rad*.8,y-th*.05]],'#246052')}}
function drawLights(){for(let side of [-1,1])for(let i=0;i<8;i++){let p=((i/8+(t*.02)%1)%1);if(p<.04)continue;let r=roadX(p),s=.12+p*1.1,x=r.cx+side*(r.half+lerp(14,W*.11,p)),y=r.y,hh=(35+p*24)*s;line([[x,y],[x,y-hh]],'#8a9ba6',Math.max(1,s*2));line([[x,y-hh],[x+side*hh*.3,y-hh]],'#b9c5cb',Math.max(1,s*2));let glow=ctx.createRadialGradient(x+side*hh*.22,y-hh,1,x+side*hh*.22,y-hh,hh*.65);glow.addColorStop(0,'#ffe6a6bb');glow.addColorStop(1,'#ffce6900');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(x+side*hh*.22,y-hh,hh*.65,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffe7ad';ctx.fillRect(x+side*hh*.15,y-hh-1,Math.max(2,s*4),Math.max(2,s*2))}}
function drawRoad(){const near=roadX(1),far=roadX(0);poly([[far.cx-far.half,far.y],[far.cx+far.half,far.y],[near.cx+near.half,near.y],[near.cx-near.half,near.y]],'#343e4a');poly([[far.cx-far.half*.94,far.y],[far.cx+far.half*.94,far.y],[near.cx+near.half*.94,near.y],[near.cx-near.half*.94,near.y]],'#222d39');for(let side of [-1,1]){let pts=[];for(let i=0;i<=24;i++){let p=i/24,r=roadX(p);pts.push([r.cx+side*r.half*.94,r.y])}line(pts,'#d9e9f2',Math.max(1,W*.002));let shoulder=[];for(let i=0;i<=24;i++){let p=i/24,r=roadX(p);shoulder.push([r.cx+side*r.half,r.y])}line(shoulder,'#68747b',Math.max(1,W*.007))}for(let i=0;i<17;i++){let p=((i/17+(t*.13)%1)%1);if(p<.04)continue;let r=roadX(p),dashH=lerp(2,H*.055,p),dashW=lerp(1,W*.006,p);ctx.fillStyle='#d9e5ee';ctx.fillRect(r.cx-dashW/2,r.y-dashH/2,dashW,dashH)}// luminous cyan route chevrons follow the curve
for(let i=0;i<12;i++){let p=((i/12+(t*.09)%1)%1);if(p<.06)continue;let r=roadX(p),s=.15+p*1.6,w=lerp(3,W*.065,p),h=lerp(3,H*.042,p);ctx.save();ctx.translate(r.cx,r.y-H*.008);ctx.shadowColor='#00efff';ctx.shadowBlur=14*s;poly([[-w*.52,h*.18],[0,-h*.45],[w*.52,h*.18],[w*.27,h*.18],[0,-h*.05],[-w*.27,h*.18]],`rgba(15,239,255,${.25+p*.75})`);ctx.restore()}// subtle road lighting
let rg=ctx.createLinearGradient(0,H*.42,0,H);rg.addColorStop(0,'#7b9ab010');rg.addColorStop(1,'#9eb4c010');ctx.fillStyle=rg;ctx.fillRect(0,H*.42,W,H*.58)}
function drawSigns(){for(let side of [-1,1]){let p=.29,r=roadX(p),x=r.cx+side*(r.half+W*.035),y=r.y;ctx.fillStyle='#8d9da8';ctx.fillRect(x-1,y-40,2,40);poly([[x-12,y-40],[x+12,y-40],[x+12,y-24],[x-12,y-24]],'#1451a0','#8bbfff',1);ctx.fillStyle='#dff7ff';ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillText(side<0?'↗':'↶',x,y-28)}}
function frame(now){if(!last)last=now;let dt=Math.min((now-last)/1000,.05);last=now;if(!paused&&!hasFix)t+=dt;else if(!paused&&hasFix&&realSpeed>1)t+=dt*Math.min(2.2,Math.max(.3,realSpeed/30));ctx.clearRect(0,0,W,H);drawSky();drawTerrain();drawBuildings();drawTrees();drawRoad();drawLights();drawSigns();requestAnimationFrame(frame)}requestAnimationFrame(frame);
function updateGPS(pos){hasFix=true;permission=true;const c=pos.coords;realSpeed=Number.isFinite(c.speed)&&c.speed>0?c.speed*3.6:0;heading=Number.isFinite(c.heading)?c.heading:null;$('speed').textContent=Math.round(realSpeed);$('gps').textContent='POSITION OK';$('state').textContent='GPS ACTIF · V45';$('status').innerHTML='<span class="tag">● GPS ACTIF</span> Position reçue · scène stylisée de démonstration';if(heading!==null)$('heading').textContent=compass(heading)}function compass(deg){return ['NORD','N-EST','EST','S-EST','SUD','S-OUEST','OUEST','N-OUEST'][Math.round(deg/45)%8]}function gpsError(err){$('gps').textContent='GPS indisponible';$('status').textContent='GPS non disponible : la scène reste testable en mode démonstration.';$('state').textContent='MODE DÉMONSTRATION'}$('gpsBtn').addEventListener('click',()=>{if(!('geolocation'in navigator)){gpsError();return}if(gpsWatch!==null){navigator.geolocation.clearWatch(gpsWatch);gpsWatch=null;hasFix=false;$('gpsBtn').textContent='ACTIVER GPS';$('gps').textContent='GPS en attente';$('state').textContent='V45 · SCÈNE 3D';$('status').textContent='Mode démonstration · flèches cyan sur la chaussée';return}gpsWatch=navigator.geolocation.watchPosition(updateGPS,gpsError,{enableHighAccuracy:true,maximumAge:1000,timeout:12000});$('gpsBtn').textContent='COUPER GPS';$('status').textContent='Demande de position GPS…'});$('motionBtn').addEventListener('click',()=>{paused=!paused;$('motionBtn').textContent=paused?'REPRENDRE':'PAUSE DÉFILEMENT'});setTimeout(()=>$('notice').classList.add('hidden'),4500);
})();
</script></body></html>
