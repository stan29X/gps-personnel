<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>GPS V48</title><style>*{box-sizing:border-box}html,body,#s{margin:0;width:100%;height:100%;overflow:hidden;background:#071a31;color:#effaff;font-family:Arial}canvas{display:block;width:100%;height:100%}.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;pointer-events:none}.p{background:#03101fe8;border:1px solid #287286;border-radius:15px;padding:10px 12px}.speed{text-align:center}.n{font-size:30px;font-weight:bold}.info{flex:1}.tag{font-size:11px;letter-spacing:1.5px;color:#60e8f3;font-weight:bold}.sub{font-size:13px;margin-top:6px}.bottom{position:absolute;bottom:12px;left:10px;right:10px;display:flex;gap:8px;align-items:end}.status{flex:1;font-size:12px}.btn{background:#071d31;color:white;border:1px solid #287286;border-radius:12px;padding:14px 10px;font-weight:bold}</style></head><body><div id="s"></div><div class="hud"><div class="p speed"><div class="n" id="speed">0</div><div>km/h GPS</div><div style="background:white;color:#111;border:4px solid #e94759;border-radius:50%;width:38px;height:38px;display:grid;place-items:center;margin:7px auto;font-weight:bold">50</div></div><div class="p info"><div class="tag">GPS PERSONNEL · V48</div><h3 style="margin:7px 0">SCÈNE 3D — TEST VISUEL</h3><div class="sub">Route courbe · bâtiments volumétriques · flèches cyan</div></div></div><div class="bottom"><div class="p status"><b style="color:#60e8f3">● SCÈNE DE TEST</b><br>Itinéraire réel non connecté</div><button class="btn" id="gps">ACTIVER GPS</button><button class="btn" id="pause">PAUSE</button></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const root=document.querySelector('#s'),scene=new THREE.Scene();scene.background=new THREE.Color(0x071a31);scene.fog=new THREE.Fog(0x071a31,75,210);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,300);camera.position.set(0,3,10);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xa8d5ff,0x24303b,2.2));const sun=new THREE.DirectionalLight(0xc5e2ff,2);sun.position.set(-15,30,10);scene.add(sun);
const M=(c,e=0)=>new THREE.MeshStandardMaterial({color:c,roughness:.9,emissive:e,emissiveIntensity:1.5});const asphalt=M(0x293849),ground=M(0x15343b),white=M(0xd8edf6),cyan=M(0x00eaff,0x00dfff),build=[M(0x35455c),M(0x2c3c53),M(0x43516a),M(0x26364b)],green=M(0x08705a),green2=M(0x0b4c43),trunk=M(0x514a45),lampMat=M(0xffd28a,0xffb344);
const land=new THREE.Mesh(new THREE.PlaneGeometry(300,350),ground);land.rotation.x=-Math.PI/2;land.position.set(0,-.2,-100);scene.add(land);
const curve=new THREE.CatmullRomCurve3([new THREE.Vector3(0,0,35),new THREE.Vector3(0,0,10),new THREE.Vector3(0,0,-8),new THREE.Vector3(4,0,-28),new THREE.Vector3(10,0,-50),new THREE.Vector3(9,0,-72),new THREE.Vector3(0,0,-96),new THREE.Vector3(-5,0,-125),new THREE.Vector3(-2,0,-165),new THREE.Vector3(0,0,-210)]);
function ribbon(w,y,material,off=0){let v=[],ix=[],ps=curve.getPoints(250);ps.forEach((p,i)=>{let t=curve.getTangent(i/250),s=new THREE.Vector3(-t.z,0,t.x).normalize();v.push(p.x+s.x*(w/2+off),y,p.z+s.z*(w/2+off),p.x-s.x*(w/2+off),y,p.z-s.z*(w/2+off));if(i<ps.length-1){let n=i*2;ix.push(n,n+1,n+2,n+1,n+3,n+2)}});let g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));g.setIndex(ix);g.computeVertexNormals();material.side=THREE.DoubleSide;scene.add(new THREE.Mesh(g,material))}
ribbon(15,.02,white,.35);ribbon(14.3,.06,asphalt);
function edgeLine(offset){let pts=[];for(let i=0;i<=250;i++){let u=i/250,p=curve.getPoint(u),t=curve.getTangent(u),s=new THREE.Vector3(-t.z,0,t.x).normalize();pts.push(new THREE.Vector3(p.x+s.x*offset,.1,p.z+s.z*offset))}scene.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),250,.055,6,false),white))}edgeLine(7.1);edgeLine(-7.1);
for(let i=0;i<60;i++){let u=.025+i*.015;if(u>.96)break;let p=curve.getPoint(u),t=curve.getTangent(u),d=new THREE.Mesh(new THREE.BoxGeometry(.18,.06,Math.max(.35,1.7*(1-u))),white);d.position.set(p.x,.12,p.z);d.rotation.y=Math.atan2(t.x,t.z);scene.add(d)}
function arrow(u){let p=curve.getPoint(u),t=curve.getTangent(u),sh=new THREE.Shape();sh.moveTo(0,1.5);sh.lineTo(-.8,.3);sh.lineTo(-.3,.3);sh.lineTo(-.3,-.8);sh.lineTo(.3,-.8);sh.lineTo(.3,.3);sh.lineTo(.8,.3);sh.closePath();let m=new THREE.Mesh(new THREE.ShapeGeometry(sh),cyan);m.rotation.x=-Math.PI/2;m.rotation.y=Math.atan2(t.x,t.z);m.position.set(p.x,.16,p.z);scene.add(m)}for(let i=0;i<13;i++)arrow(.04+i*.055);
function box(w,h,d,mat,x,z){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,h/2,z);scene.add(m)}
function tree(x,z,s){box(.25*s,1.1*s,.25*s,trunk,x,z);for(let k=0;k<3;k++){let c=new THREE.Mesh(new THREE.ConeGeometry((1-k*.2)*s,1.65*s,7),k%2?green:green2);c.position.set(x,.9*s+k*.62*s,z);scene.add(c)}}
function lamp(x,z,dir){box(.12,4.2,.12,M(0x8295a6),x,z);box(.7,.1,.12,M(0x8295a6),x+dir*.25,z);let b=new THREE.Mesh(new THREE.SphereGeometry(.18,10,8),lampMat);b.position.set(x+dir*.5,4.05,z);scene.add(b);let l=new THREE.PointLight(0xffc36c,2,12);l.position.copy(b.position);scene.add(l)}
for(let side of [-1,1])for(let i=0;i<19;i++){let z=3-i*10.5,near=i<5,x=side*(near?10.5+(i%2)*2:13+(i%4)*1.5),h=near?10+(i%4)*3:7+(i%5)*2;box(near?5:3.5+(i%3),h,near?5:4,build[(i+(side===1?1:0))%4],x,z-4);tree(side*(8.5+(i%3)*.6),z-1,near?1.25:.8);lamp(side*(8.2+(i%2)*.3),z-3,side===-1?1:-1)}
let paused=false,walk=0,watch;function frame(){requestAnimationFrame(frame);if(!paused){walk+=.0018;let u=.015+(walk%1)*.15,p=curve.getPoint(u),t=curve.getTangent(u);camera.position.set(p.x,3.1,p.z+9);camera.lookAt(p.x+t.x*28,1,p.z-t.z*28)}renderer.render(scene,camera)}frame();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'REPRENDRE':'PAUSE'};document.querySelector('#gps').onclick=e=>{if(!navigator.geolocation){e.target.textContent='GPS INDISPONIBLE';return}e.target.textContent='GPS…';navigator.geolocation.getCurrentPosition(p=>{document.querySelector('#speed').textContent=Math.round((p.coords.speed||0)*3.6);e.target.textContent='GPS ACTIF';watch=navigator.geolocation.watchPosition(q=>document.querySelector('#speed').textContent=Math.round((q.coords.speed||0)*3.6),()=>{}, {enableHighAccuracy:true,maximumAge:1000})},()=>e.target.textContent='GPS REFUSÉ',{enableHighAccuracy:true,timeout:10000})};
</script></body></html>
