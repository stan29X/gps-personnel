<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>GPS V49</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071a31;color:#effaff;font-family:Arial,sans-serif}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.hud{position:absolute;z-index:2;top:10px;left:10px;right:10px;display:flex;gap:8px}.panel{background:rgba(3,15,29,.9);border:1px solid #286074;border-radius:14px;padding:10px 12px}.speed{text-align:center;min-width:76px}.n{font-size:29px;font-weight:800}.small{font-size:12px;color:#bfd0df}.limit{display:grid;place-items:center;width:37px;height:37px;margin:6px auto 0;border:4px solid #e84657;border-radius:50%;background:#fff;color:#111;font-weight:800}.info{flex:1}.tag{font-size:11px;font-weight:800;letter-spacing:1.3px;color:#65e7f3}.title{font-size:16px;font-weight:800;margin-top:5px}.desc{font-size:12px;color:#c3d4df;margin-top:4px}.bottom{position:absolute;z-index:2;bottom:12px;left:10px;right:10px;display:flex;gap:7px;align-items:flex-end}.status{flex:1;font-size:11px;line-height:1.35}.btn{border:1px solid #28788b;border-radius:12px;background:#071d31;color:#f2fbff;font-weight:800;font-size:11px;padding:13px 10px;min-height:44px}@media(min-width:650px){.hud{top:20px;left:20px;right:20px}.panel{padding:14px 17px}.n{font-size:38px}.title{font-size:22px}.tag{font-size:13px}.desc{font-size:15px}.bottom{left:20px;right:20px;bottom:20px}.btn{font-size:14px;padding:15px}}</style></head><body><canvas id="c"></canvas><div class="hud"><div class="panel speed"><div class="n" id="speed">0</div><div class="small">km/h GPS</div><div class="limit">50</div></div><div class="panel info"><div class="tag">GPS PERSONNEL · V49</div><div class="title">TEST DE PERSPECTIVE</div><div class="desc">Route immersive · blocs 3D simplifiés · flèches cyan</div></div></div><div class="bottom"><div class="panel status"><b style="color:#65e7f3">● SCÈNE DE TEST</b><br>Rendu graphique autonome — itinéraire réel non connecté</div><button class="btn" id="gps">ACTIVER GPS</button><button class="btn" id="pause">PAUSE</button></div><script>
const c=document.getElementById('c'),ctx=c.getContext('2d');let W,H,dpr,paused=false,offset=0,watch=null;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function poly(p,col){ctx.beginPath();p.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();ctx.fillStyle=col;ctx.fill()}function line(a,b,col,w){ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.strokeStyle=col;ctx.lineWidth=w;ctx.stroke()}function ellipse(x,y,rx,ry,col){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=col;ctx.fill()}function draw(){if(!paused)offset=(offset+.0015)%1;ctx.clearRect(0,0,W,H);const cx=W/2,h=H*.43;let sky=ctx.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#06162e');sky.addColorStop(.7,'#173957');sky.addColorStop(1,'#3b6174');ctx.fillStyle=sky;ctx.fillRect(0,0,W,h+2);let glow=ctx.createRadialGradient(cx,h,1,cx,h,W*.5);glow.addColorStop(0,'rgba(80,155,190,.25)');glow.addColorStop(1,'rgba(5,20,42,0)');ctx.fillStyle=glow;ctx.fillRect(0,h-70,W,160);ctx.fillStyle='#19373b';ctx.fillRect(0,h,W,H-h);for(let s of [-1,1])for(let i=0;i<11;i++){let z=i/10,y=h+z*z*H*.12,x=cx+s*(W*(.14+z*.46)),bw=W*(.014+z*.035),bh=H*(.04+z*.15);poly([[x-bw/2,y],[x-bw/2,y-bh],[x+bw/2,y-bh*.97],[x+bw/2,y]],['#26364b','#344157','#202f45','#3b465a'][i%4])}function edgeAt(t){let y=h+Math.pow(t,1.6)*(H-h)*1.04,x=cx+W*(.10*Math.sin(t*2.7+offset*2)-.025*Math.sin(t*6)),half=W*(.02+Math.pow(t,1.35)*.42);return{x,y,l:x-half,r:x+half,half}}let L=[],R=[],OL=[],OR=[];for(let i=0;i<=80;i++){let e=edgeAt(i/80);L.push([e.l,e.y]);R.push([e.r,e.y]);OL.push([e.l-W*(.008+i/80*.025),e.y]);OR.push([e.r+W*(.008+i/80*.025),e.y])}poly([...OL,...OR.slice().reverse()],'#65757b');poly([...L,...R.slice().reverse()],'#273544');line(OL[0],OL.at(-1),'#c4d6dc',1.5);line(OR[0],OR.at(-1),'#c4d6dc',1.5);for(let i=0;i<25;i++){let t=(i/25+offset)%1;if(t<.02)continue;let e=edgeAt(t),ww=1+t*5,hh=2+t*25;poly([[e.x-ww/2,e.y-hh/2],[e.x+ww/2,e.y-hh/2],[e.x+ww/2,e.y+hh/2],[e.x-ww/2,e.y+hh/2]],'#e3f4fa')}let objects=[];for(let s of [-1,1])for(let i=0;i<17;i++)objects.push({s,t:.025+((i/17+offset*.38)%1)*.94,i,type:i%3});objects.sort((a,b)=>a.t-b.t);for(let o of objects){let e=edgeAt(o.t),s=o.s,i=o.i,t=o.t,x=e.x+s*(e.half+W*(.02+t*.075)),y=e.y;if(o.type===0){let bw=W*(.012+t*.04),bh=H*(.05+t*.17);poly([[x-bw/2,y-bh],[x+bw/2,y-bh*.96],[x+bw/2,y],[x-bw/2,y]],['#35445a','#293b51','#405068'][i%3]);poly([[x+bw/2,y-bh*.96],[x+bw/2+bw*.2,y-bh*.86],[x+bw/2+bw*.2,y],[x+bw/2,y]],'#17263a')}else if(o.type===1){let r=W*(.007+t*.018),th=H*(.035+t*.08);poly([[x-r*.16,y-th*.3],[x+r*.16,y-th*.3],[x+r*.16,y],[x-r*.16,y]],'#57473a');poly([[x,y-th*1.2],[x-r,y-th*.25],[x+r,y-th*.25]],'#075342');poly([[x,y-th*.85],[x-r*.72,y],[x+r*.72,y]],'#0b7057')}else{let ph=H*(.025+t*.075),lx=x-s*W*(.004+t*.006);line([x,y],[x,y-ph],'#9aacb8',Math.max(1,t*2));line([x,y-ph],[lx,y-ph],'#9aacb8',Math.max(1,t*2));ellipse(lx,y-ph,Math.max(1,t*4),Math.max(1,t*3),'#ffda9b');ellipse(lx,y-ph,Math.max(3,t*11),Math.max(2,t*8),'rgba(255,195,95,.16)')}}for(let i=0;i<13;i++){let t=.025+((i/13+offset*1.1)%1)*.88,e=edgeAt(t),z=W*(.005+t*.027);ctx.save();ctx.translate(e.x,e.y);ctx.shadowColor='#00eaff';ctx.shadowBlur=7+t*13;poly([[0,-z*1.8],[-z,z*.25],[-z*.35,z*.1],[-z*.35,z],[z*.35,z],[z*.35,z*.1],[z,z*.25]],`rgba(0,235,255,${.4+t*.55})`);ctx.restore()}let fade=ctx.createLinearGradient(0,H*.75,0,H);fade.addColorStop(0,'rgba(4,17,30,0)');fade.addColorStop(1,'rgba(4,17,30,.28)');ctx.fillStyle=fade;ctx.fillRect(0,H*.75,W,H*.25);requestAnimationFrame(draw)}requestAnimationFrame(draw);document.getElementById('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'REPRENDRE':'PAUSE'};document.getElementById('gps').onclick=e=>{if(!navigator.geolocation){e.target.textContent='GPS INDISPONIBLE';return}e.target.textContent='GPS…';navigator.geolocation.getCurrentPosition(p=>{document.getElementById('speed').textContent=Math.round((p.coords.speed||0)*3.6);e.target.textContent='GPS ACTIF';if(watch!==null)navigator.geolocation.clearWatch(watch);watch=navigator.geolocation.watchPosition(q=>document.getElementById('speed').textContent=Math.round((q.coords.speed||0)*3.6),()=>{}, {enableHighAccuracy:true,maximumAge:1000,timeout:10000})},()=>{e.target.textContent='GPS REFUSÉ'}, {enableHighAccuracy:true,timeout:10000})};
</script></body></html>
