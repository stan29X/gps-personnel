<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>GPS Personnel V47</title><style>*{box-sizing:border-box}html,body,#view{margin:0;width:100%;height:100%;overflow:hidden;background:#06152b;color:#eefaff;font-family:Arial,sans-serif}#view{position:absolute;inset:0}canvas{display:block;width:100%;height:100%}.hud{position:absolute;z-index:2;top:12px;left:12px;right:12px;display:flex;gap:9px;pointer-events:none}.panel{background:#041322df;border:1px solid #27778c;border-radius:16px;padding:11px 13px;box-shadow:0 8px 25px #0005}.speed{text-align:center;min-width:90px}.num{font-size:30px;font-weight:800}.unit{font-size:12px;color:#b9d1df}.limit{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;margin-top:7px;background:white;border:5px solid #ed4256;color:#111;border-radius:50%;font-weight:800}.turn{flex:1;min-width:0}.eyebrow{font-size:11px;font-weight:800;letter-spacing:1.5px;color:#68e8f5}.direction{font-size:17px;font-weight:800;margin-top:5px}.sub{font-size:12px;color:#b9cad9;margin-top:5px}.cap{position:absolute;top:106px;right:12px;z-index:2;font-weight:800}.bottom{position:absolute;z-index:2;left:12px;right:12px;bottom:16px;display:flex;align-items:flex-end;gap:8px}.status{flex:1;min-width:0;font-size:12px;line-height:1.35}.actions{display:flex;gap:7px}.btn{border:1px solid #3b8797;border-radius:13px;background:#031525ed;color:#eafaff;padding:13px 10px;font-weight:800;font-size:12px;min-height:48px}@media(min-width:700px){.hud{top:20px;left:20px;right:20px;gap:14px}.panel{padding:15px 18px}.num{font-size:40px}.direction{font-size:23px}.eyebrow{font-size:13px}.sub{font-size:15px}.cap{top:130px;right:20px}.bottom{left:20px;right:20px;bottom:20px}.btn{font-size:14px;padding:15px 18px}}</style></head><body><div id="view"></div><div class="hud"><div class="panel speed"><div class="num" id="speed">0</div><div class="unit">km/h GPS</div><div class="limit">50</div></div><div class="panel turn"><div class="eyebrow">GPS PERSONNEL · V47</div><div class="direction">↱ SCÈNE 3D IMMERSIVE</div><div class="sub">Route courbe · bâtiments volumétriques · flèches cyan</div></div></div><div class="panel cap" id="cap">CAP —</div><div class="bottom"><div class="panel status"><span style="color:#4ceafa">●</span> <b>SCÈNE 3D</b><br>Prototype graphique — itinéraire réel non connecté</div><div class="actions"><button class="btn" id="gps">ACTIVER GPS</button><button class="btn" id="pause">PAUSE</button></div></div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const root=document.getElementById('view'),scene=new THREE.Scene();scene.background=new THREE.Color(0x071a36);scene.fog=new THREE.FogExp2(0x071a36,.0065);
const camera=new THREE.PerspectiveCamera(67,innerWidth/innerHeight,.1,500);camera.position.set(0,2.8,8);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x9bcaff,0x101725,1.65));const moon=new THREE.DirectionalLight(0xa9caff,1.25);moon.position.set(-15,28,12);scene.add(moon);
const mat=(c,e=0,ei=0)=>new THREE.MeshStandardMaterial({color:c,roughness:.9,emissive:e,emissiveIntensity:ei});const roadM=mat(0x263344),groundM=mat(0x112a32),edgeM=mat(0xb3c6d0),cyanM=mat(0x00eaff,0x00dfff,2.6),whiteM=mat(0xe1f5ff,0x8bdfff,.3),buildM=[mat(0x28354b),mat(0x354057),mat(0x202c42),mat(0x3b4356)],greenM=[mat(0x07533f),mat(0x08745a),mat(0x0b463c)],trunkM=mat(0x39323a),lampM=mat(0xffd68a,0xffb74d,3.2);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(300,500),groundM);ground.rotation.x=-Math.PI/2;ground.position.set(0,-.2,-190);scene.add(ground);
const curve=new THREE.CatmullRomCurve3([new THREE.Vector3(0,0,35),new THREE.Vector3(0,0,8),new THREE.Vector3(0,0,-10),new THREE.Vector3(4,0,-30),new THREE.Vector3(12,0,-53),new THREE.Vector3(15,0,-76),new THREE.Vector3(8,0,-100),new THREE.Vector3(-3,0,-128),new THREE.Vector3(-5,0,-164),new THREE.Vector3(2,0,-215)]);
function ribbon(width,y,material,offset=0){const ps=curve.getPoints(280),v=[],idx=[];for(let i=0;i<ps.length;i++){const p=ps[i],t=curve.getTangent(i/(ps.length-1)),s=new THREE.Vector3(-t.z,0,t.x).normalize();for(const sign of [-1,1])v.push(p.x+s.x*(width/2+offset)*sign,y,p.z+s.z*(width/2+offset)*sign);if(i<ps.length-1){const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2)}}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));g.setIndex(idx);g.computeVertexNormals();scene.add(new THREE.Mesh(g,material))}
ribbon(15,.015,edgeM,.45);ribbon(14.4,.045,roadM);
function roadLine(d,m,r){const ps=[];for(let i=0;i<=280;i++){const u=i/280,p=curve.getPoint(u),t=curve.getTangent(u),s=new THREE.Vector3(-t.z,0,t.x).normalize();ps.push(new THREE.Vector3(p.x+s.x*d,.09,p.z+s.z*d))}scene.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(ps),330,r,6,false),m))}roadLine(7.05,whiteM,.05);roadLine(-7.05,whiteM,.05);
for(let i=0;i<72;i++){const u=.025+i*.013,p=curve.getPoint(Math.min(.98,u)),t=curve.getTangent(Math.min(.98,u));const dash=new THREE.Mesh(new THREE.BoxGeometry(.18,.05,Math.max(.35,1.45*(1-u))),whiteM);dash.position.set(p.x,.095,p.z);dash.rotation.y=Math.atan2(t.x,t.z);scene.add(dash)}
function arrow(u){const p=curve.getPoint(u),t=curve.getTangent(u),sh=new THREE.Shape();sh.moveTo(0,1.45);sh.lineTo(-.8,.25);sh.lineTo(-.32,.25);sh.lineTo(-.32,-.75);sh.lineTo(.32,-.75);sh.lineTo(.32,.25);sh.lineTo(.8,.25);sh.closePath();const mesh=new THREE.Mesh(new THREE.ShapeGeometry(sh),cyanM);mesh.rotation.x=-Math.PI/2;mesh.rotation.y=Math.atan2(t.x,t.z);mesh.position.set(p.x,.15,p.z);mesh.scale.setScalar(.6+u*.7);scene.add(mesh);return mesh}const arrows=[];for(let i=0;i<16;i++)arrows.push(arrow(.045+i*.053));
function box(w,h,d,m,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y+h/2,z);scene.add(o);return o}
function tree(x,z,s){box(.22*s,1*s,.22*s,trunkM,x,0,z);for(let k=0;k<3;k++){const cone=new THREE.Mesh(new THREE.ConeGeometry((1.05-k*.2)*s,1.65*s,7),greenM[k%3]);cone.position.set(x,.9*s+k*.68*s,z);scene.add(cone)}}
function lamp(x,z,side){box(.075,4.1,.075,mat(0x8191a2),x,0,z);box(.7,.08,.08,mat(0x8191a2),x+side*.25,4,z);const bulb=new THREE.Mesh(new THREE.SphereGeometry(.14,10,8),lampM);bulb.position.set(x+side*.48,3.95,z);scene.add(bulb);const l=new THREE.PointLight(0xffc875,1.8,12);l.position.copy(bulb.position);scene.add(l)}
for(const side of [-1,1])for(let i=0;i<21;i++){const z=8-i*10.8,near=i<4,dist=Math.abs(z)/25,x=side*(10.4+Math.min(13,dist*1.8)),h=(7+(i%5)*3)*(near?1.25:1),w=(4+(i%3)*1.5)*(near?1.2:1);box(w,h,5+(i%2)*2,buildM[(i+(side>0?1:0))%4],x,0,z-2);tree(side*(8.1+(i%3)*.55),z,Math.max(.58,1.25-i*.025));lamp(side*8.15,z-3,side===-1?1:-1)}
for(const side of [-1,1])for(let i=0;i<35;i++){const z=4-i*6.5;box(1.2,.48,3,mat(0x175044),side*(8.1+Math.max(0,-z)*.012),0,z)}
// Soft blue glow at the horizon and scattered stars.
const sky=new THREE.Group();scene.add(sky);for(let i=0;i<130;i++){const star=new THREE.Mesh(new THREE.SphereGeometry(.035+Math.random()*.035,5,5),mat(0x8bbfe8,0x356baf,.6));star.position.set((Math.random()-.5)*210,10+Math.random()*55,-55-Math.random()*150);sky.add(star)}
let running=true,travel=0,last=performance.now(),watch=null;function animate(now){requestAnimationFrame(animate);const dt=Math.min(.05,(now-last)/1000);last=now;if(running){travel+=dt*.45;const u=(.015+travel*.006)% .8,p=curve.getPointAt(u),t=curve.getTangentAt(u);camera.position.set(p.x,2.75,p.z+8);camera.lookAt(p.x+t.x*28,1.3,p.z-t.z*28);for(const a of arrows){a.position.y=.14+Math.sin(now*.002+a.position.z)*.015}}renderer.render(scene,camera)}requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});document.getElementById('pause').onclick=e=>{running=!running;e.target.textContent=running?'PAUSE':'REPRENDRE'};document.getElementById('gps').onclick=e=>{if(!navigator.geolocation){e.target.textContent='GPS INDISPONIBLE';return}e.target.textContent='GPS…';navigator.geolocation.watchPosition(p=>{document.getElementById('speed').textContent=Math.round((p.coords.speed||0)*3.6);if(p.coords.heading!=null)document.getElementById('cap').textContent='CAP '+Math.round(p.coords.heading)+'°';e.target.textContent='GPS ACTIF'},()=>{e.target.textContent='GPS REFUSÉ'},{enableHighAccuracy:true,maximumAge:1000,timeout:12000})};
</script></body></html>
