<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#06111f"><title>GPS Personnel — V46 3D</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071321;color:#eafaff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}#scene{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}.hud{position:fixed;z-index:2;display:flex;gap:9px;align-items:stretch;top:12px;left:12px;right:12px;pointer-events:none}.panel{background:#04101de8;border:1px solid #1a5366;border-radius:15px;padding:10px 13px;box-shadow:0 8px 28px #0004;backdrop-filter:blur(8px)}.speed{min-width:104px;text-align:center}.speed strong{display:block;font-size:29px;line-height:1.15}.speed small,.next small{color:#b9cedb}.limit{font-size:19px;color:#fff;border:4px solid #f04459;background:#fff;color:#101722;border-radius:50%;width:40px;height:40px;display:grid;place-items:center;margin:6px auto 0;font-weight:800}.next{flex:1;min-width:0}.eyebrow{font-size:11px;letter-spacing:1.5px;color:#5de7f4;font-weight:800}.next strong{display:block;font-size:clamp(15px,4vw,22px);line-height:1.15;margin:4px 0}.next small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mode{position:fixed;z-index:2;right:12px;top:120px;background:#04101de8;border:1px solid #1a5366;border-radius:13px;padding:9px 12px;font-weight:800;font-size:13px}.bottom{position:fixed;z-index:2;bottom:16px;left:12px;right:12px;display:flex;gap:8px;align-items:end}.status{flex:1;min-width:0;background:#04101de8;border:1px solid #1a5366;border-radius:13px;padding:9px 11px;font-size:12px;color:#c7d9e3}.status b{color:#5de7f4}.controls{display:flex;gap:7px}.controls button{border:1px solid #246477;background:#071d2b;color:#eafaff;border-radius:12px;padding:11px 12px;font-weight:800;font-size:12px;min-height:43px}.controls button:active{background:#0b4150}.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:78px;color:#aac4d1;font-size:10px;text-align:center;white-space:nowrap;text-shadow:0 2px 5px #000}@media(min-width:700px){.hud{top:20px;left:20px;right:20px}.panel{padding:14px 18px}.speed{min-width:130px}.bottom{left:20px;right:20px;bottom:20px}.controls button{font-size:14px;padding:13px 18px}.mode{right:20px;top:140px}}
</style></head><body><div id="scene"></div><div class="hud"><div class="panel speed"><strong id="speed">0 <span style="font-size:13px">km/h</span></strong><small>Vitesse GPS</small><div class="limit">50</div></div><div class="panel next"><div class="eyebrow">GPS PERSONNEL · V46</div><strong>ESSAI 3D — SCÈNE VOLUMÉTRIQUE</strong><small id="gpsline">Décor 3D de démonstration</small></div></div><div class="mode" id="heading">CAP —</div><div class="hint">Prototype 3D · flèches visuelles de démonstration</div><div class="bottom"><div class="status" id="status"><b>● SCÈNE 3D</b> Route, immeubles et arbres en volumes 3D</div><div class="controls"><button id="gps">ACTIVER GPS</button><button id="pause">PAUSE</button></div></div>
<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
const root=document.querySelector('#scene');const scene=new THREE.Scene();scene.background=new THREE.Color(0x07182e);scene.fog=new THREE.Fog(0x07182e,45,220);
const camera=new THREE.PerspectiveCamera(67,innerWidth/innerHeight,.1,500);camera.position.set(0,2.05,8);camera.lookAt(0,1,-18);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x8ebfff,0x17212a,2.0));const moon=new THREE.DirectionalLight(0x8fbfff,1.5);moon.position.set(-20,35,15);scene.add(moon);
const mat=(c,r=.9,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});const asphalt=mat(0x242d37,.95),side=mat(0x37414a),line=mat(0xd7e4e9),buildingMats=[mat(0x253449),mat(0x303b50),mat(0x202c3d),mat(0x354055)],grass=mat(0x102d2b),treeMat=mat(0x124b3c),treeMat2=mat(0x1c5b48),poleMat=mat(0x596c7c,.5,.3),lampMat=new THREE.MeshStandardMaterial({color:0xffd99a,emissive:0xffbd64,emissiveIntensity:3});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),grass);ground.rotation.x=-Math.PI/2;ground.position.y=-.08;ground.position.z=-100;scene.add(ground);
const roadGroup=new THREE.Group();scene.add(roadGroup);const road=new THREE.Mesh(new THREE.PlaneGeometry(11,280),asphalt);road.rotation.x=-Math.PI/2;road.position.set(0,0,-110);roadGroup.add(road);
// Road shoulders and painted edges
for(const x of [-5.7,5.7]){const sh=new THREE.Mesh(new THREE.PlaneGeometry(.65,280),side);sh.rotation.x=-Math.PI/2;sh.position.set(x,.015,-110);roadGroup.add(sh);const edge=new THREE.Mesh(new THREE.PlaneGeometry(.12,280),line);edge.rotation.x=-Math.PI/2;edge.position.set(x<0?-5.32:5.32,.03,-110);roadGroup.add(edge)}
for(let z=12;z>-245;z-=10){const d=new THREE.Mesh(new THREE.PlaneGeometry(.14,4.6),line);d.rotation.x=-Math.PI/2;d.position.set(0,.035,z);roadGroup.add(d)}
// Chevrons sit on the road and recede in perspective
const arrows=[];for(let i=0;i<18;i++){const shape=new THREE.Shape();shape.moveTo(-.9,-.35);shape.lineTo(0,.55);shape.lineTo(.9,-.35);shape.lineTo(.55,-.35);shape.lineTo(0,.05);shape.lineTo(-.55,-.35);shape.closePath();const geo=new THREE.ShapeGeometry(shape);const mesh=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:0x00eaff,transparent:true,opacity:.9,side:THREE.DoubleSide}));mesh.rotation.x=-Math.PI/2;mesh.position.set(0,.07,7-i*8);mesh.scale.set(1+i*.035,1+i*.035,1);roadGroup.add(mesh);arrows.push(mesh)}
// Street-side blocks, conical low-poly trees, and street lamps
const scenery=new THREE.Group();scene.add(scenery);function addBuilding(x,z,w,h,d,mi){const g=new THREE.Group();const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),buildingMats[mi%buildingMats.length]);b.position.y=h/2;g.add(b);g.position.set(x,0,z);scenery.add(g)}
function addTree(x,z,s){const g=new THREE.Group();const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.12*s,.18*s,1.3*s,5),mat(0x3b3934));trunk.position.y=.65*s;g.add(trunk);for(let j=0;j<3;j++){const cone=new THREE.Mesh(new THREE.ConeGeometry((1.0-j*.19)*s,1.9*s,6),j===1?treeMat2:treeMat);cone.position.y=(1.45+j*.72)*s;g.add(cone)}g.position.set(x,0,z);scenery.add(g)}
function addLamp(x,z){const g=new THREE.Group();const p=new THREE.Mesh(new THREE.CylinderGeometry(.045,.065,3.5,6),poleMat);p.position.y=1.75;g.add(p);const arm=new THREE.Mesh(new THREE.BoxGeometry(.65,.07,.07),poleMat);arm.position.set(x<0?.25:-.25,3.45,0);g.add(arm);const bulb=new THREE.Mesh(new THREE.SphereGeometry(.15,8,6),lampMat);bulb.position.set(x<0?.5:-.5,3.38,0);g.add(bulb);const light=new THREE.PointLight(0xffc779,13,17,2);light.position.copy(bulb.position);g.add(light);g.position.set(x,0,z);scenery.add(g)}
for(let sideSign of [-1,1]){for(let i=0;i<29;i++){const z=8-i*8.3;const dist=7+(i*.33);if(i%3!==1)addTree(sideSign*dist,z,Math.max(.35,1.35-i*.025));if(i%4===0)addBuilding(sideSign*(dist+4+Math.random()*3),z-3,2.8+Math.random()*3,4+Math.random()*10,3+Math.random()*3,Math.floor(Math.random()*4));if(i%3===0)addLamp(sideSign*(5.9+Math.min(i*.12,2)),z-1)}}
// A subtle curve ahead made from sequential road slices, while the close road remains continuous
// horizon glow
const horizon=new THREE.Mesh(new THREE.PlaneGeometry(500,70),new THREE.MeshBasicMaterial({color:0x153454,transparent:true,opacity:.22}));horizon.position.set(0,19,-120);scene.add(horizon);
let paused=false,gpsWatch=null,lastHeading=0,hasGps=false,simT=0;const status=document.querySelector('#status'),gpsLine=document.querySelector('#gpsline'),headingEl=document.querySelector('#heading');
document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'REPRENDRE':'PAUSE';status.innerHTML=paused?'<b>● PAUSE</b> Défilement arrêté':'<b>● SCÈNE 3D</b> Route et décor en mouvement'};
document.querySelector('#gps').onclick=()=>{if(!navigator.geolocation){status.textContent='GPS indisponible dans ce navigateur';return}status.textContent='Demande de position GPS…';gpsWatch=navigator.geolocation.watchPosition(p=>{hasGps=true;const c=p.coords;const kmh=Math.round((c.speed||0)*3.6);document.querySelector('#speed').innerHTML=kmh+' <span style="font-size:13px">km/h</span>';if(Number.isFinite(c.heading)&&c.heading!==null){lastHeading=c.heading;headingEl.textContent='CAP '+Math.round(lastHeading)+'°'}gpsLine.textContent=`Position reçue · précision ±${Math.round(c.accuracy||0)} m`;status.innerHTML='<b>● GPS ACTIF</b> Position réelle reçue';},e=>{status.textContent='GPS non obtenu — vérifie l’autorisation du navigateur'}, {enableHighAccuracy:true,maximumAge:1000,timeout:12000});};
function animate(){requestAnimationFrame(animate);const dt=Math.min(.05,clock.getDelta());if(!paused){simT+=dt;roadGroup.position.z=(roadGroup.position.z+dt*3.8)%10;scenery.position.z=(scenery.position.z+dt*3.8)%8;arrows.forEach((a,i)=>{a.position.z+=dt*3.8;if(a.position.z>12)a.position.z-=144;a.material.opacity=.55+.35*(1-i/18)});camera.position.x=Math.sin(simT*.13)*.28;camera.position.y=2.05+Math.sin(simT*.7)*.025;camera.lookAt(Math.sin(simT*.11)*1.4,1.25,-22);if(hasGps&&lastHeading){camera.rotation.z=THREE.MathUtils.lerp(camera.rotation.z,0,dt)}}renderer.render(scene,camera)}const clock=new THREE.Clock();animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
