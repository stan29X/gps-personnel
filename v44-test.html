<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>GPS Personnel V44 — Prototype conduite</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111b;color:#effaff;font-family:system-ui,sans-serif}canvas{position:absolute;inset:0;width:100%;height:100%}.hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.panel{background:#050c15c9;border:1px solid #7dd3fc35;border-radius:14px;padding:11px 13px;backdrop-filter:blur(9px)}#status{font-size:10px;letter-spacing:.1em;font-weight:900;color:#67e8f9}#hint{font-size:11px;line-height:1.35;color:#c0d1dc;margin-top:5px;max-width:210px}#speed{font-size:27px;font-weight:900;text-align:right}small{font-size:10px;color:#a6bdca}#cap{text-align:right;font-size:11px;color:#cbd5e1}#bottom{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:10px;right:10px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}button{border:1px solid #ffffff30;background:#101d2b;color:#f1f5f9;border-radius:12px;padding:12px 14px;font-weight:850;font-size:12px}.primary{border-color:#22d3ee99;color:#67e8f9;background:#06232c}#note{position:absolute;bottom:72px;left:12px;right:12px;text-align:center;color:#a9bfcb;font-size:10px;text-shadow:0 2px 5px #000}
</style></head><body><canvas id="scene"></canvas>
<div class="hud"><div class="panel"><div id="status">V44 • PROTOTYPE DE CONDUITE</div><div id="hint">Vue virtuelle en perspective. Autorise la localisation pour afficher les données GPS.</div></div><div class="panel"><div id="speed">-- <small>km/h</small></div><div id="cap">Cap : --°</div></div></div>
<div id="note">Prototype visuel : chaussée et bâtiments simplifiés, pas encore une carte routière 3D réelle.</div><div id="bottom"><button class="primary" id="gpsBtn">◎ ACTIVER LE GPS</button><button id="modeBtn">MODE : LIBRE</button></div>
<script>
(()=>{const c=document.querySelector('canvas'),x=c.getContext('2d'),S=document.getElementById('status'),H=document.getElementById('hint'),V=document.getElementById('speed'),C=document.getElementById('cap'),G=document.getElementById('gpsBtn'),M=document.getElementById('modeBtn');let w,h,d=1,phase=0,last=0,gps=null,watch=null,mode='LIBRE',curve=0;
function size(){d=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0)}function poly(p,col){x.beginPath();p.forEach((q,i)=>i?x.lineTo(...q):x.moveTo(...q));x.closePath();x.fillStyle=col;x.fill()}function line(p,col,l){x.beginPath();p.forEach((q,i)=>i?x.lineTo(...q):x.moveTo(...q));x.strokeStyle=col;x.lineWidth=l;x.stroke()}
function frame(t){requestAnimationFrame(frame);let dt=Math.min(.05,(t-last)/1000||0);last=t;phase=(phase+dt*(gps&&gps.speed>1?Math.max(.2,gps.speed/18):.12))%1;let hz=h*.43,vx=w*(.5+curve*.18),bx=w*.5;let gr=x.createLinearGradient(0,0,0,h*.68);gr.addColorStop(0,'#07111e');gr.addColorStop(.6,'#18394b');gr.addColorStop(1,'#8ba7ad');x.fillStyle=gr;x.fillRect(0,0,w,h);
x.fillStyle='#102431';for(let a=0;a<w;){let bw=18+(a*13%31),bh=12+(a*7%43);x.fillRect(a,hz-bh,bw,bh);x.fillStyle='#1b3947';for(let yy=hz-bh+5;yy<hz-4;yy+=9)for(let xx=a+4;xx<a+bw-3;xx+=9)if((xx+yy)%3<2)x.fillRect(xx,yy,3,4);x.fillStyle='#102431';a+=bw+2}
x.fillStyle='#26343c';x.fillRect(0,hz,w,h-hz);poly([[vx-w*.025,hz],[vx+w*.025,hz],[w*.93,h],[w*.07,h]],'#202a31');poly([[vx-w*.031,hz],[vx-w*.025,hz],[w*.07,h],[0,h]],'#4c5557');poly([[vx+w*.025,hz],[vx+w*.031,hz],[w,h],[w*.93,h]],'#4c5557');line([[vx-w*.025,hz],[w*.07,h]],'#c5d3d5',2);line([[vx+w*.025,hz],[w*.93,h]],'#c5d3d5',2);
for(let i=0;i<12;i++){let z=(i/12+phase)%1,p=z*z,y=hz+(h-hz)*p,cx=vx+(bx-vx)*p;x.fillStyle='#e3e9e8';x.fillRect(cx-(1+p*3)/2,y,1+p*3,3+p*28)}
for(let i=0;i<7;i++){let z=(i/7+phase*.82)%1,p=z*z,y=hz+(h-hz)*p,s=4+p*Math.min(w*.055,34),cx=vx+(bx-vx)*p+curve*18*p;x.save();x.translate(cx,y);x.globalAlpha=.32+p*.68;x.shadowColor='#22d3ee';x.shadowBlur=10*p;poly([[0,-s*1.25],[s*.8,-s*.15],[s*.28,-s*.15],[s*.28,s],[-s*.28,s],[-s*.28,-s*.15],[-s*.8,-s*.15]],'#22d3ee');x.restore()}
for(let side of [-1,1])for(let i=0;i<5;i++){let z=(i/5+phase*.12)%1,p=z*z,by=hz+(h-hz)*p,sc=.12+p*1.4,off=w*.12+p*w*.25,xx=vx+side*off,bw=(15+i%3*9)*sc,bh=(30+i%4*13)*sc;if(by>hz+2)poly([[xx-bw/2,by-bh],[xx+bw/2,by-bh-3*sc],[xx+bw/2,by],[xx-bw/2,by]],i%2?'#263e49':'#314650')}
let sh=x.createLinearGradient(0,h*.78,0,h);sh.addColorStop(0,'#02080e00');sh.addColorStop(1,'#02080ecf');x.fillStyle=sh;x.fillRect(0,h*.72,w,h*.28);poly([[w*.23,h],[w*.34,h*.91],[w*.66,h*.91],[w*.77,h]],'#0a111a');line([[w*.34,h*.91],[w*.5,h*.88],[w*.66,h*.91]],'#78d2e640',2);V.innerHTML=(gps?Math.round(gps.speed):'--')+' <small>km/h</small>';C.textContent='Cap : '+(gps&&gps.heading!=null?Math.round(gps.heading)+'°':'--')+' • '+mode}
function pos(p){let q=p.coords;gps={lat:q.latitude,lon:q.longitude,speed:Number.isFinite(q.speed)?Math.max(0,q.speed*3.6):0,heading:Number.isFinite(q.heading)&&q.heading>=0?q.heading:null};S.textContent='GPS ACTIF • VUE CONDUITE';H.textContent='Position reçue. La scène est une représentation simplifiée.';G.textContent='✓ GPS ACTIF'}
G.onclick=()=>{if(!navigator.geolocation){H.textContent='GPS indisponible dans ce navigateur.';return}if(watch!==null){navigator.geolocation.clearWatch(watch);watch=null;G.textContent='◎ ACTIVER LE GPS';return}G.textContent='LOCALISATION…';navigator.geolocation.getCurrentPosition(pos,e=>{H.textContent=({1:'Autorisation refusée : autorise la localisation.',2:'Position GPS indisponible.',3:'Délai GPS dépassé.'})[e.code]||'Erreur GPS.'},{enableHighAccuracy:true,maximumAge:2000,timeout:15000});watch=navigator.geolocation.watchPosition(pos,e=>{H.textContent='Erreur GPS ('+e.code+'). Vérifie les autorisations.'},{enableHighAccuracy:true,maximumAge:2000,timeout:15000})};M.onclick=()=>{mode=mode==='LIBRE'?'GUIDAGE DÉMO':'LIBRE';M.textContent='MODE : '+mode;S.textContent=mode==='LIBRE'?'CONDUITE LIBRE • VUE 3D':'GUIDAGE DÉMO • VUE 3D';H.textContent=mode==='LIBRE'?'Roulage libre, sans destination nécessaire.':'Démonstration uniquement : aucun itinéraire réel raccordé.';curve=mode==='LIBRE'?0:.12};addEventListener('resize',size);size();requestAnimationFrame(frame)})();
</script></body></html>
